# Profile verify's fixed cost on a generated pytest project (acceptance gate C16): CLI medians, one traced cold run
# (subprocess timeline and own-time profile), pytest start-up natively and under bubblewrap. Generated code only.
name: profile

on:
  workflow_dispatch:
  push:
    branches: ["profile/**"]

permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python -m repo_ai sandbox status
      - name: profile
        run: python scripts/profile_verify.py --work "$RUNNER_TEMP/prof" --out "profile-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-${{ matrix.os }}
          path: profile-${{ matrix.os }}.json
